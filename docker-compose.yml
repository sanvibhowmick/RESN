version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: resn_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_DB: ${DB_NAME:-resn_school}
    ports:
      - "5433:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d resn_school"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Broker for Asynchronous Task Worker Queue
  redis:
    image: redis:7-alpine
    container_name: resn_redis
    ports:
      - "6379:6379"
    restart: always

  # Background Celery Worker for Asynchronous PDF Generation & Multi-Agent Jobs
  worker:
    build: .
    container_name: resn_celery_worker
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-resn_school}
      - DB_USER=${DB_USER:-admin}
      - DB_PASS=${DB_PASS:-password}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: on-failure
