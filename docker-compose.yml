version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg15  # Change from postgres:15 to this
    container_name: resn_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-resn_school}
    ports:
      - "5433:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d
    